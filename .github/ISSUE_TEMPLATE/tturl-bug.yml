name: tturl bug
description: Report a problem with the tturl command.
labels:
  - bug
  - tturl
body:
  - type: markdown
    attributes:
      value: |
        Report vulnerabilities privately as described in
        [SECURITY.md](https://github.com/tantosec/tturl/security/policy).

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behaviour you observed and what you expected.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Provide `tturl --version`, or identify the source build.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: If available, provide a minimal command or sequence of steps.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
